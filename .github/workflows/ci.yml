# Runs on every push and pull request to main, from a fresh clone: the golden vectors are
# regenerated by the Python reference, then the C++ model's tests check against them.
# Vivado, xsim and on-board runs are out of scope here — see docs/DECISIONS.md D-012.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: model + reference (${{ matrix.cxx }})
    runs-on: ubuntu-24.04
    strategy:
      # Let both compilers finish: a failure on only one of them is the interesting case.
      fail-fast: false
      matrix:
        cxx: [g++, clang++]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      # CPU-only torch first, so requirements.txt finds it already satisfied instead of pulling
      # the CUDA build from PyPI.
      - name: Install Python dependencies
        run: |
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements.txt

      # The reference does not depend on the C++ compiler, so it only runs on one leg.
      - name: Reference tests
        if: matrix.cxx == 'g++'
        run: |
          python reference/test_reference.py
          python reference/test_quantize.py

      # Runs on both legs: the compiler is what the matrix varies. CXX overrides the Makefile's
      # `CXX ?= g++`. Plain `make` also builds src/main.cpp, which the test binaries don't link.
      - name: Build and test C++ model
        working-directory: model
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          "$CXX" --version
          make
          make test

# Reference configuration: the point in the design space that represents the project's real
# target. N=1024 with d=64 is a realistic sequence length for a small transformer, and it is where
# the tiling thesis should show up clearly.
#
# Requires the 'full' vectors: python3 reference/gen_vectors.py --set full

# --- Problem ---
seq_len  = 1024
head_dim = 64

# --- Systolic array ---
# 12x12 = 144 MACs fits directly in the XC7Z020's 220 DSPs, with headroom for softmax and
# control. See docs/DECISIONS.md D-003.
array_rows = 12
array_cols = 12

# --- On-chip memory ---
sram_bytes = 512000

# --- External DRAM ---
dram_bw_bytes_per_cycle = 21
dram_latency_cycles     = 30

# --- What to run ---
dataflow    = flash
vectors_dir = ../vectors/full

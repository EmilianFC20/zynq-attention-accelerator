# Smoke configuration: tiny, meant to verify that the toolchain works end to end.
# It is not useful for measuring anything — at N=8 the pipeline fill dominates everything.
#
# Format: key = value, one pair per line. '#' comments to end of line.

# --- Problem ---
seq_len  = 8
head_dim = 8

# --- Systolic array ---
# Deliberately small so that N=8 doesn't leave it completely idle.
array_rows = 4
array_cols = 4

# --- On-chip memory ---
# 500 KB working budget, not the XC7Z020's full 630 KB: control logic and AXI FIFOs consume
# BRAM too. See docs/HARDWARE.md.
sram_bytes = 512000

# --- External DRAM ---
# 21 B/cycle ≈ 2.1 GB/s from the Arty Z7's DDR3 at a 100 MHz PL clock.
# Theoretical peak, pending recalibration against real Phase 2 measurements.
dram_bw_bytes_per_cycle = 21
dram_latency_cycles     = 30

# --- What to run ---
dataflow    = flash
vectors_dir = ../vectors/smoke
